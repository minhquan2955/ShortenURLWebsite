<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Shorten any long URL into a compact, shareable link. Generate QR codes instantly. Fast, free, and secure."
    />
    <link rel="stylesheet" href="style.css" />
    <title>Shorten Links Instantly</title>
  </head>
  <body>
    <!-- Hero — Dark Tile -->
    <section class="hero">
      <h1 class="hero-headline">Shorten a long link.</h1>
      <p class="hero-tagline">Free forever. No sign-up required.</p>
    </section>

    <!-- Main — Parchment Tile -->
    <section class="main-section">
      <div class="card">
        <h2 class="section-title">Create a short URL</h2>

        <div class="card-content">
          <div class="left-panel">
            <div class="input-group">
              <label for="url-input">Your long link</label>
              <input
                type="url"
                id="url-input"
                class="url-input"
                placeholder="https://example.com/my-long-url"
                autocomplete="off"
                spellcheck="false"
              />
              <p id="url-error" class="error-text" style="display: none"></p>
            </div>

            <!-- Toggle QR -->
            <div class="toggle-group">
              <label class="switch">
                <input type="checkbox" id="qr-toggle" />
                <span class="slider"></span>
              </label>
              <label for="qr-toggle" class="toggle-label-text"
                >Generate QR Code</label
              >
            </div>

            <button class="submit-btn" type="button">
              Get your link <span>&rarr;</span>
            </button>
          </div>

          <div class="right-panel">
            <div
              id="result-container"
              style="display: none; text-align: center; width: 100%"
            >
              <p class="result-label">Shortened URL</p>
              <a
                id="short-url"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
              ></a>
              <img
                id="qr-code-img"
                src=""
                alt="QR Code"
                style="display: none"
              />
            </div>
            <div id="result-placeholder">
              <p>Your short link will appear here.</p>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Footer — Parchment -->
    <footer class="footer">
      <p>
        Built by
        <a
          href="https://github.com/minhquan2955"
          target="_blank"
          rel="noopener noreferrer"
          >MinhQuan</a
        >
        · ShortenURL
      </p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
